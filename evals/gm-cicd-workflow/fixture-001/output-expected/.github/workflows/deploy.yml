# Workflow de deploy do MeuApp-API — build → GHCR → ssh-action → deploy.sh
# Gerado a partir do perfil de infra do produto (docs/INFRA_PROFILE.md).
name: Deploy MeuApp-API

on:
  push:
    branches: [main]

concurrency:
  group: deploy-meuapp-api
  cancel-in-progress: false

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/meuapp/meuapp-api:latest

      - name: Deploy na VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/meuapp
            bash scripts/deploy.sh
