name: Bug report
description: Report a problem with golmet
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the fields below —
        issues missing repro information take longer to fix.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `golmet --version`
      placeholder: golmet version 0.3.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine (if applicable)
      options:
        - opencode
        - claude-code
        - not engine-related
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal commands/steps starting from an empty state.
      placeholder: |
        1. golmet init
        2. golmet validate
        3. error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output / logs
      description: Paste the relevant command output (wrap in code fences).
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a duplicate
          required: true
        - label: I redacted any confidential/client information from the output above
          required: true
