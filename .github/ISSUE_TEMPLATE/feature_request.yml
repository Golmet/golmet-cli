name: Feature request
description: Propose an improvement or new capability for golmet
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Before opening, please read [ROADMAP.md](../blob/main/ROADMAP.md) —
        the proposal may already be planned or deliberately out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like golmet to do? Be as concrete as possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other tools you evaluated.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked ROADMAP.md and existing issues for overlap
          required: true
        - label: I understand features are accepted at the maintainer's discretion and scope is bounded by docs/FORMAT.md
          required: true
