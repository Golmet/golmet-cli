# Release do golmet — disparada por tag v* (push manual OU o workflow
# version, que a despacha por workflow_dispatch após calcular a versão por
# Conventional Commits). Build cross-compile das 5 plataformas alvo,
# checksums SHA-256 e GitHub Release IDEMPOTENTE com os assets + notas
# geradas por git-cliff a partir dos Conventional Commits (seção da versão
# atual; o CHANGELOG completo acompanha a release como asset). M38 — o publish npm ganhou certeza: o token é pré-validado
# (npm whoami, fail fast com mensagem de remediação), os 5 pacotes de
# plataforma publicam ANTES do principal (o npm resolve as
# optionalDependencies na instalação), publishes já-feitos são skip
# idempotente e QUALQUER falha de publish fecha o job VERMELHO — a release
# e os assets permanecem no ar (o re-run completa só o que falta).
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'A tag v* a ser lançada (ex.: v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # full + tags: o gerador de notas (git-cliff) e a comparação com a
          # tag anterior precisam do histórico completo — checkout raso deixou
          # o digest cego e as notas da v1.2.0 saíram vazias
          fetch-depth: 0
          fetch-tags: true

      - name: Release notes (git-cliff — seção da versão atual)
        uses: orhun/git-cliff-action@v4
        with:
          version: latest
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: CHANGELOG completo (git-cliff — asset da release)
        uses: orhun/git-cliff-action@v4
        with:
          version: latest
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Resolve a versão (a tag é a fonte da verdade)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.tag || github.ref_name }}"
          case "${VERSION}" in
            v[0-9]*.*.*) ;;
            *) echo "::error::a release roda sobre uma tag v* — recebido '${VERSION}'"; exit 1 ;;
          esac
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "lançando ${VERSION} (commit $(git rev-parse --short HEAD))"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build cross-compile matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/Golmet/golmet-cli/internal/cli.Version=${VERSION}"
          targets=(
            "windows/amd64"
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
          )
          for target in "${targets[@]}"; do
            goos="${target%%/*}"
            goarch="${target##*/}"
            name="golmet_${goos}_${goarch}"
            if [ "${goos}" = "windows" ]; then
              name="${name}.exe"
            fi
            echo "build ${name}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags "${LDFLAGS}" \
              -o "dist/${name}" ./cmd/golmet
            if [ "${goos}" != "windows" ]; then
              chmod 755 "dist/${name}"
            fi
          done

      - name: Checksums (SHA-256)
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release (idempotente — re-run não quebra)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${VERSION}" \
            --title "golmet ${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            dist/* CHANGELOG.md \
            || gh release upload "${VERSION}" dist/* CHANGELOG.md --clobber

      - name: Mount platform npm packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NPM="${VERSION#v}"
          # os dirs npm/<os>-<arch>/ (o package.json esqueleto é versionado
          # no repo — o shape validado pelo job release-readiness do CI);
          # o binário cross-compilado entra como o file declarado e a
          # versão é fixada pela TAG (a fonte da verdade — o package.json
          # versionado pode estar um degrau atrás; o registry, nunca)
          mount_pkg() {
            local goos="$1" goarch="$2" pkgos="$3" pkgarch="$4" ext="$5"
            local dir="npm/${pkgos}-${pkgarch}"
            cp "dist/golmet_${goos}_${goarch}${ext}" "${dir}/golmet${ext}"
            if [ "${goos}" != "windows" ]; then chmod 755 "${dir}/golmet${ext}"; fi
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('${dir}/package.json', 'utf8'));
              p.version = '${VERSION_NPM}';
              fs.writeFileSync('${dir}/package.json', JSON.stringify(p, null, 2) + '\n');
            "
          }
          mount_pkg windows amd64 win32 x64 .exe
          mount_pkg linux amd64 linux x64 ""
          mount_pkg linux arm64 linux arm64 ""
          mount_pkg darwin amd64 darwin x64 ""
          mount_pkg darwin arm64 darwin arm64 ""

      - name: Preflight npm (npm whoami — fail fast com remediação)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          if ! npm whoami --registry https://registry.npmjs.org; then
            echo "::error::npm whoami falhou — o secret NPM_TOKEN está ausente, expirado ou sem permissão de write (regenere o token Granular com 'All packages' read-and-write e atualize o secret do repo)"
            exit 1
          fi
          echo "npm autenticado como $(npm whoami --registry https://registry.npmjs.org)"

      - name: Publish platform npm packages (os 5 ANTES do principal)
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NPM="${VERSION#v}"
          FAILED=""
          for d in npm/win32-x64 npm/linux-x64 npm/linux-arm64 npm/darwin-x64 npm/darwin-arm64; do
            pkg="@golmet/cli-${d##*/}"
            if npm view "${pkg}@${VERSION_NPM}" version >/dev/null 2>&1; then
              echo "${pkg}@${VERSION_NPM} já publicado — skip idempotente"
            elif (cd "$d" && npm publish --access public); then
              echo "✓ ${pkg}@${VERSION_NPM} publicado"
            else
              echo "::error::npm publish falhou para ${pkg}"
              FAILED="${FAILED} ${pkg}"
            fi
          done
          echo "FAILED_PKGS=${FAILED}" >> "${GITHUB_ENV}"

      - name: Publish main npm package (por ÚLTIMO)
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NPM="${VERSION#v}"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '${VERSION_NPM}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          if npm view "golmet-cli@${VERSION_NPM}" version >/dev/null 2>&1; then
            echo "golmet-cli@${VERSION_NPM} já publicado — skip idempotente"
          elif npm publish --access public; then
            echo "✓ golmet-cli@${VERSION_NPM} publicado"
          else
            echo "::error::npm publish falhou para golmet-cli"
            echo "FAILED_PKGS=${FAILED_PKGS:-} golmet-cli" >> "${GITHUB_ENV}"
          fi

      - name: Status da release (VERMELHO se qualquer publish falhou)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FAILED_PKGS:-}" ]; then
            echo "::error::release INCOMPLETA — publishes falharam:${FAILED_PKGS} (os assets do GitHub estão no ar; corrija o npm e re-rune — os publishes são idempotentes)"
            exit 1
          fi
          echo "release ${VERSION} completa — GitHub Release + npm ×6 ✓"
