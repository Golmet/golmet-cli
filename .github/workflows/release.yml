# Release do golmet — disparado por tag v*: build cross-compile das 5
# plataformas alvo (actions oficiais, sem GoReleaser), checksums SHA-256 e
# GitHub Release com os assets + notas do CHANGELOG. M31: além dos assets,
# o workflow MONTA os 5 pacotes npm de plataforma (npm/<os>-<arch>/ com o
# binário) e publica via `npm publish` — **os 5 de plataforma ANTES do
# pacote principal** (o npm resolve as optionalDependencies na instalação
# do principal). O publish é TOLERANTE A FALHA (decisão da M4): o release
# nunca quebra por npm — cada passo leva continue-on-error.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build cross-compile matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X github.com/Golmet/golmet-cli/internal/cli.Version=${VERSION}"
          targets=(
            "windows/amd64"
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
          )
          for target in "${targets[@]}"; do
            goos="${target%%/*}"
            goarch="${target##*/}"
            name="golmet_${goos}_${goarch}"
            if [ "${goos}" = "windows" ]; then
              name="${name}.exe"
            fi
            echo "build ${name}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags "${LDFLAGS}" \
              -o "dist/${name}" ./cmd/golmet
            if [ "${goos}" != "windows" ]; then
              chmod 755 "dist/${name}"
            fi
          done

      - name: Checksums (SHA-256)
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Release notes (seção da versão no CHANGELOG)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="dist/RELEASE_NOTES.md"
          {
            echo "# golmet ${GITHUB_REF_NAME}"
            echo
            # extrai a seção "## [X.Y.Z] ..." correspondente ao CHANGELOG;
            # sem seção → aponta para o CHANGELOG (o release nunca falha por nota)
            awk -v ver="${VERSION}" '
              $0 ~ "^## \\[" ver "\\]" { found = 1; next }
              /^## \[/ && found { exit }
              found { print }
            ' CHANGELOG.md > /tmp/section.md
            if [ -s /tmp/section.md ]; then
              cat /tmp/section.md
            else
              echo "Notas completas em [CHANGELOG.md](https://github.com/Golmet/golmet-cli/blob/main/CHANGELOG.md)."
            fi
          } > "${NOTES_FILE}"
          echo "NOTES_FILE=${NOTES_FILE}" >> "${GITHUB_ENV}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "golmet ${GITHUB_REF_NAME}" \
            --notes-file "${NOTES_FILE}" \
            dist/*

      - name: Mount platform npm packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # os dirs npm/<os>-<arch>/ (o package.json esqueleto é versionado
          # no repo — o shape validado por teste); o binário cross-compilado
          # entra como o file declarado e a versão é fixada pela tag
          mount_pkg() {
            local goos="$1" goarch="$2" pkgos="$3" pkgarch="$4" ext="$5"
            local dir="npm/${pkgos}-${pkgarch}"
            cp "dist/golmet_${goos}_${goarch}${ext}" "${dir}/golmet${ext}"
            if [ "${goos}" != "windows" ]; then chmod 755 "${dir}/golmet${ext}"; fi
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('${dir}/package.json', 'utf8'));
              p.version = '${VERSION}';
              fs.writeFileSync('${dir}/package.json', JSON.stringify(p, null, 2) + '\n');
            "
          }
          mount_pkg windows amd64 win32 x64 .exe
          mount_pkg linux amd64 linux x64 ""
          mount_pkg linux arm64 linux arm64 ""
          mount_pkg darwin amd64 darwin x64 ""
          mount_pkg darwin arm64 darwin arm64 ""

      - name: Publish platform npm packages (tolerante a falha — M4)
        continue-on-error: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # a autenticação npm via ~/.npmrc (o secret NPM_TOKEN)
          echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > ~/.npmrc
          # OS 5 DE PLATAFORMA PRIMEIRO — o npm resolve as
          # optionalDependencies na instalação do pacote principal
          for d in npm/win32-x64 npm/linux-x64 npm/linux-arm64 npm/darwin-x64 npm/darwin-arm64; do
            (cd "$d" && npm publish --access public) \
              || echo "aviso: npm publish falhou para $d — o release segue (npm é tolerante a falha, M4)"
          done

      - name: Publish main npm package (por ÚLTIMO — tolerante a falha)
        continue-on-error: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > ~/.npmrc
          npm publish --access public \
            || echo "aviso: npm publish do principal falhou — o release segue (npm é tolerante a falha, M4); os binários ficam nos assets da release"
