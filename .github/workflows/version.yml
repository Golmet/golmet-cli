# version — a fonte da verdade do versionamento do kit. TODO merge na main
# passa por aqui: os subjects dos commits desde a última tag v* são
# classificados por Conventional Commits e a próxima versão (semver) é
# calculada — feat → minor, fix → patch, `!` (qualquer tipo) ou footer
# `BREAKING CHANGE:` → major; demais tipos (docs/chore/refactor/test/ci/
# style/build) não geram release — nenhum merge de docs cria versão
# fantasma. Com bump: grava a versão nos 6 package.json (raiz + 5 de
# plataforma), empurra o commit `chore(release): vX.Y.Z` na main e cria a
# tag anotada NESE COMMIT DE BUMP — a árvore da tag carrega a versão
# publicada (checkout da tag = versão certa, sem stamp). O push do commit
# usa a DEPLOY KEY (secret BUMP_DEPLOY_KEY): o GITHUB_TOKEN builtin não
# pode entrar na lista de bypass do ruleset (restrição do GitHub) e a main
# exige PR + 1 aprovação. Depois DESPACHA o workflow release explicitamente
# (push de tag feito com o GITHUB_TOKEN não dispara workflows — o
# workflow_dispatch é a exceção documentada).
name: version

on:
  push:
    branches: [main]

permissions:
  contents: write
  # o dispatch do workflow release (gh workflow run) exige a permissão de
  # actions — sem ela o dispatch leva 403 "Resource not accessible by
  # integration" (a v1.1.0 nasceu com a tag mas precisou de dispatch manual)
  actions: write

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (histórico completo + tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Próxima versão (Conventional Commits → semver)
        id: semver
        shell: bash
        run: |
          set -euo pipefail
          # a tag de referência é a mais próxima NO HISTÓRIO de HEAD (sempre
          # ancestral dela); ordenar a lista global de tags apanharia uma tag
          # v* nascida em branch não-main e o bump sairia de um range errado
          # (commits antigos entram no cálculo — versão fantasma)
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
          if [ -n "${LAST_TAG}" ]; then
            MAJOR="$(echo "${LAST_TAG#v}" | cut -d. -f1)"
            MINOR="$(echo "${LAST_TAG#v}" | cut -d. -f2)"
            PATCH="$(echo "${LAST_TAG#v}" | cut -d. -f3)"
            RANGE="${LAST_TAG}..HEAD"
          else
            MAJOR=0
            MINOR=0
            PATCH=0
            RANGE="HEAD"
          fi
          SUBJECTS=$(git log "${RANGE}" --pretty=%s)
          BODIES=$(git log "${RANGE}" --pretty=%b || true)

          BUMP="none"
          # major: `!` no subject (qualquer tipo) ou footer BREAKING CHANGE:
          if printf '%s\n' "${SUBJECTS}" | grep -qE '^[a-z]+(\([^)]*\))?!:' \
            || printf '%s\n' "${BODIES}" | grep -q '^BREAKING CHANGE:'; then
            BUMP="major"
          elif printf '%s\n' "${SUBJECTS}" | grep -qE '^feat(\([^)]*\))?:'; then
            BUMP="minor"
          elif printf '%s\n' "${SUBJECTS}" | grep -qE '^fix(\([^)]*\))?:'; then
            BUMP="patch"
          fi

          if [ "${BUMP}" = "none" ]; then
            echo "sem commits releasáveis desde ${LAST_TAG:-a origem} — nenhuma tag, nenhuma release"
            echo "bump=none" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          case "${BUMP}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "bump=${BUMP}" >> "${GITHUB_OUTPUT}"
          echo "version=${NEXT}" >> "${GITHUB_OUTPUT}"
          echo "última tag: ${LAST_TAG:-nenhuma} · próxima versão: ${NEXT} (${BUMP})"

      - name: Grava a versão nos 6 package.json e empurra o commit de bump
        if: steps.semver.outputs.bump != 'none'
        env:
          BUMP_DEPLOY_KEY: ${{ secrets.BUMP_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.semver.outputs.version }}"
          VERSION_NPM="${VERSION#v}"
          # idempotência: re-run com os arquivos já na versão alvo → pula o
          # commit; a tag vem no passo seguinte (e se a tag já existe o run
          # inteiro termina no skip dela)
          CURRENT="$(node -p "require('./package.json').version")"
          if [ "${CURRENT}" = "${VERSION_NPM}" ]; then
            echo "package.json já em ${VERSION_NPM} — commit de bump pulado (idempotente)"
            exit 0
          fi
          # race com merge humano: a main avançou desde o checkout → falha
          # ruidosa e o re-run recomputa sobre a ponta (a concurrency
          # serializa os runs do version — a janela de corrida é só de merge
          # humano, rara)
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main avançou desde o checkout — re-run do workflow para recomputar sobre a ponta"
            exit 1
          fi
          # grava a versão nos 6 package.json e nos optionalDependencies —
          # MESMO padrão de aspas do release.yml: este bloco vive entre
          # aspas duplas do bash, NUNCA use aspas duplas aqui (comentário
          # com aspas fecha a string e o node roda script truncado)
          node -e "
            const fs = require('fs');
            const dirs = ['.', 'npm/win32-x64', 'npm/linux-x64', 'npm/linux-arm64', 'npm/darwin-x64', 'npm/darwin-arm64'];
            for (const d of dirs) {
              const p = JSON.parse(fs.readFileSync(d + '/package.json', 'utf8'));
              p.version = '${VERSION_NPM}';
              for (const name of Object.keys(p.optionalDependencies || {})) {
                p.optionalDependencies[name] = '${VERSION_NPM}';
              }
              fs.writeFileSync(d + '/package.json', JSON.stringify(p, null, 2) + '\n');
            }
          "
          # auto-assert: os 6 sincronizados na versão alvo antes de qualquer
          # push (o commit não passa por PR — valida aqui)
          node -e "
            const fs = require('fs');
            const dirs = ['.', 'npm/win32-x64', 'npm/linux-x64', 'npm/linux-arm64', 'npm/darwin-x64', 'npm/darwin-arm64'];
            const seen = new Set(dirs.map(d => JSON.parse(fs.readFileSync(d + '/package.json', 'utf8')).version));
            if (seen.size !== 1 || [...seen][0] !== '${VERSION_NPM}') {
              console.error('versões divergentes após o stamp: ' + [...seen].join(', '));
              process.exit(1);
            }
          "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json npm/win32-x64/package.json npm/linux-x64/package.json npm/linux-arm64/package.json npm/darwin-x64/package.json npm/darwin-arm64/package.json
          git commit -m "chore(release): ${VERSION}" -m "bump automático do workflow version — a tag aponta para este commit e a árvore dela carrega a versão publicada"
          # o push usa a deploy key: a main exige PR (ruleset) e o
          # github-actions[bot] não pode receber bypass — o actor DeployKey
          # (bypass always) é o único caminho de push direto do CI
          mkdir -p ~/.ssh
          printf '%s\n' "${BUMP_DEPLOY_KEY}" > ~/.ssh/bump_deploy_key
          chmod 600 ~/.ssh/bump_deploy_key
          git remote set-url --push origin "git@github.com:${{ github.repository }}.git"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/bump_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git push origin "HEAD:main"
          echo "commit de bump ${VERSION} empurrado na main"

      - name: Cria e empurra a tag + despacha a release
        if: steps.semver.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.semver.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "tag ${VERSION} já existe na origin — skip (re-run/race)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # re-sincroniza antes de taggear: a tag nasce NO COMMIT DE BUMP
          # (tip da main após o push do passo anterior — ou nele mesmo no
          # caso idempotente), nunca num ancestral sem a versão na árvore
          git fetch origin main
          git tag -a "${VERSION}" origin/main -m "release ${VERSION}"
          git push origin "refs/tags/${VERSION}"
          gh workflow run release.yml --ref main -f tag="${VERSION}"
          echo "tag ${VERSION} empurrada + workflow release despachado"
