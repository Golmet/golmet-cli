# F3_PILOTO — registry de amostra do lote FULL (5 de 61 skills + 29 agents)
# Fonte da verdade do piloto: metadados + ponteiro para o corpo canônico
# (sources/<id>.md) na linguagem de CAPACIDADES (ask/subagent/parallel —
# sem nomes de tools de engine). O emitter (render-agents.mjs) projeta
# este registry + corpo para o formato de cada engine.
version: pilot-1
engines:
  opencode: templates/opencode.mjs
  claude-code: templates/claude-code.mjs

items:
  # ---- 1. PRIMARY (o mais caro do lote: 15 delegações) ----
  - id: gm-req
    kind: primary
    description: >-
      Agente principal para elicitação de requisitos, descoberta de negócio
      e intake greenfield na letra R (Requirements). Conduz reuniões,
      clarificação de ambiguidades, REQUIREMENTS.md, acordos de escopo e
      Change Requests.
    mode: primary
    temperature: 0.3
    delegates: [gm-next, gm-progress, gm-cr-propagation-guard, gm-tasks-pending, gm-intake-orchestrator, gm-requirements-orchestrator, gm-governance-orchestrator, gm-github-orchestrator, gm-azure-orchestrator, gm-figma-orchestrator, gm-workflow-builder, gm-workflow-improver, gm-onboarding-orchestrator, gm-compliance-orchestrator]
    invokes: [gm-handover, gm-setup, gm-agent-health-monitor, gm-drift-detector, gm-mcp-playwright-setup, gm-prompt-gate, gm-azure-workitem-creator, gm-detect-onboarding, gm-task-spec]
    requires: [file, edit, glob, grep, shell, ask, subagent, skill, tracker, websearch]
    degrades: [webfetch, lsp, graph]
    tracker: true   # conteúdo de tracker github/azure mantido com nota de capacidade
    body: sources/gm-req.md

  # ---- 2. SUBAGENT orquestrador (mapa estático da fase) ----
  - id: gm-requirements-orchestrator
    kind: subagent
    description: >-
      Orquestrador da fase de Requisitos: centraliza o mapa de skills de
      clarify, requirements, change requests, scope agreement, sync com
      cliente e relatórios. Documento de referência — roteia, não executa.
    mode: subagent
    temperature: 0.1
    invokes: [gm-clarify, gm-requirements, gm-change-request, gm-scope-agreement, gm-client-requirements, gm-client-report, gm-decision-log, gm-decision-audit]
    requires: [file, glob, grep, ask, skill]
    degrades: [edit]
    body: sources/gm-requirements-orchestrator.md

  # ---- 3. SUBAGENT executor backend ----
  - id: gm-dev-backend
    kind: subagent
    description: >-
      Executor genérico de código backend — detecta a stack do repo via
      glob, carrega o playbook correspondente e implementa a task a partir
      de specs e RNs. Spec antes de código, rastreabilidade RN, testes
      verdes, relatório compacto. Nunca edita specs do módulo nem commita
      sem pedido.
    mode: subagent
    temperature: 0.1
    invokes: [gm-stack-java-quarkus, gm-stack-rust, gm-stack-dotnet-csharp, gm-quality-gates]
    requires: [file, edit, glob, grep, skill, graph, shell]
    degrades: [webfetch]
    graph: true     # orientação estrutural opcional via capacidade graph
    body: sources/gm-dev-backend.md

  # ---- 4. SKILL com twin BASE (edição FULL — converge com gm-requirements BASE) ----
  - id: gm-requirements
    kind: skill
    twin: gm-requirements   # twin BASE já publicada no kit — esta é a edição FULL
    description: >-
      Gera ou atualiza REQUIREMENTS.md a partir da transcrição de reunião
      de negócios: criação inicial e merge incremental, promoção de PEND a
      RN (a RN ancora feature; PEND nunca), decisões em DECISIONS.md e
      CHANGELOG.md como efeito colateral.
    requires: [file, edit, ask, tracker]
    degrades: []
    body: sources/gm-requirements.md

  # ---- 5. AGENT revisor (sem twin — divergência da spec: era listado como
  #         skill no pedido; na árvore real é agent. Pipeline idêntico.) ----
  - id: gm-dev-reviewer
    kind: subagent
    description: >-
      Revisão formal pré-PR do diff da task: RNs cobertas no diff, quality
      gates, security audit contra a base de segurança, docs vivas e eixo
      compliance quando a task toca dado pessoal. Veredito approve /
      request-changes com lista acionável. Nunca edita nem commita.
    mode: subagent
    temperature: 0.1
    invokes: [gm-quality-gates, gm-security-audit]
    requires: [file, glob, grep, skill, shell-readonly]
    degrades: [edit, write, webfetch]
    body: sources/gm-dev-reviewer.md

  # ================= ONDA 1 (8 itens sem-twin) =================

  - id: gm-dev-orchestrator
    kind: subagent
    description: >-
      Orquestrador do domínio Dev: roteia o ciclo de fechamento da task
      (boilerplate → executor backend/frontend → QA independente → revisão
      formal pré-PR → PR só de task aprovada). Roteia, não executa.
    mode: subagent
    temperature: 0.1
    invokes: [gm-stack-boilerplate, gm-quality-gates]
    requires: [file, glob, grep, shell, tracking, ask]
    degrades: [edit, write]
    evals: [fixture-001]
    body: sources/gm-dev-orchestrator.md

  - id: gm-dev-qa
    kind: subagent
    description: >-
      QA independente do domínio Dev — roda as suítes conforme o playbook da
      stack, mede cobertura e compara contra TEST_STRATEGY/DEFINITION_OF_DONE.
      Veredito binário APROVADA/REPROVADA. Read-only: só executa e reporta.
    mode: subagent
    temperature: 0.1
    invokes: [gm-stack-java-quarkus, gm-stack-dotnet-csharp, gm-stack-rust, gm-stack-angular]
    requires: [file, glob, grep, skill, shell]
    degrades: [edit, write, webfetch]
    body: sources/gm-dev-qa.md

  - id: gm-devops-orchestrator
    kind: subagent
    description: >-
      Orquestrador da fase de DevOps: roteia infraestrutura e deploy —
      setup de VPS, troubleshooting por sintoma, pipeline GitHub Actions e
      observabilidade. Roteia, não executa; modo guiado inegociável.
    mode: subagent
    temperature: 0.1
    invokes: [gm-vps-setup, gm-vps-troubleshoot, gm-cicd-workflow, gm-observability]
    requires: [file, glob, grep, shell, skill, ask, tracking]
    degrades: [edit, write]
    evals: [fixture-001]
    body: sources/gm-devops-orchestrator.md

  - id: gm-quality-orchestrator
    kind: subagent
    description: >-
      Orquestrador da fase de Qualidade e Entrega (convergência da DAG):
      test strategy, rastreabilidade, validação da DAG, lint documental e
      auditoria de performance. Documento de referência — não executa nada.
    mode: subagent
    temperature: 0.1
    invokes: [gm-test-strategy, gm-traceability, gm-validate, gm-wiki-lint]
    requires: [file, glob, grep, skill, ask]
    degrades: [edit, write]
    body: sources/gm-quality-orchestrator.md

  - id: gm-vps-setup
    kind: skill
    description: >-
      Wizard guiado de setup de VPS nova: sistema, Docker+Compose+buildx,
      registry, deploy keys, chave SSH do GitHub Actions, tunnel Cloudflare
      EXCLUSIVO por servidor, systemd, logging, pipeline de deploy e backup
      RClone. Modo guiado — o operador executa na VPS. 12 fases na ordem.
    requires: [file, glob, grep, ask, shell, ssh]
    degrades: [edit, write]
    evals: [fixture-001]
    body: sources/gm-vps-setup.md

  - id: gm-vps-troubleshoot
    kind: skill
    description: >-
      Diagnóstico guiado por sintoma para VPS já configurada: container
      unhealthy, GHCR denied, SSH action falhando, services duplicados,
      tunnel compartilhado, porta ocupada, banco vazio. Modo guiado com
      triagem por tabela de sintomas (runbook).
    requires: [file, glob, grep, ask, shell, ssh]
    degrades: [edit, write]
    evals: [fixture-001]
    body: sources/gm-vps-troubleshoot.md

  - id: gm-cicd-workflow
    kind: skill
    description: >-
      Cria e mantém o pipeline de deploy GitHub Actions dos repos de produto
      (build → registry → ssh-action → deploy.sh). Dois modos: gerar
      workflow novo e auditar workflow existente por matriz de sintomas.
    requires: [file, glob, grep, write, edit, shell, ask, websearch, webfetch]
    degrades: []
    evals: [fixture-001]
    body: sources/gm-cicd-workflow.md

  - id: gm-observability
    kind: skill
    description: >-
      Configura verificação de saúde e alertas para APIs em VPS:
      healthcheck do compose, endpoint /health, watchdog com canal de
      alerta do perfil, cron e logs com rotação. Escopo mínimo KISS — sem
      stack de métricas sem demanda validada.
    requires: [file, glob, grep, write, edit, shell, ask]
    degrades: []
    body: sources/gm-observability.md

  # ================= ONDA 2 (8 itens com-twin: FULL = BASE + extras) =================

  - id: gm-clarify
    kind: skill
    twin: gm-clarify
    description: >-
      Questiona ambiguidades com score 0-100 por item (>= 70 vira RN/CR,
      < 70 vira PEND com follow-up); reavaliação incremental; triagem de
      PENDs existentes com Ambiguidade Zero; checkpoint em meetings/.
    requires: [file, ask]
    degrades:
      ask: chat-stop
    evals: [fixture-001, fixture-002, fixture-003]
    body: sources/gm-clarify.md

  - id: gm-charter
    kind: skill
    twin: gm-charter
    description: >-
      PROJECT_CHARTER.md a partir da primeira conversa: modos completo e
      simplificado (projetos existentes), campos legado/sistema_existente/
      compliance, repos com HEAD congelado, regra de localização de
      artefatos.
    requires: [file, ask]
    degrades: []
    evals: [fixture-001]
    body: sources/gm-charter.md

  - id: gm-taskspec
    kind: skill
    twin: gm-taskspec
    description: >-
      Gera a análise funcional + spec técnica pura (analysis/) e o arquivo
      de feature (delivery/) com a RN como âncora; templates canônicos e
      checkpoint post-write validate. PEND nunca ancora feature.
    requires: [file, edit, write, ask]
    degrades: []
    evals: [fixture-001, fixture-002, fixture-003]
    body: sources/gm-taskspec.md

  - id: gm-uispec
    kind: skill
    twin: gm-uispec
    description: >-
      UI_SPEC.md a partir das RNs: atores e telas, conteúdo por tela,
      fluxo de navegação e regras de UI globais. Propagação de confiança
      para RNs de legado.
    requires: [file, edit, write]
    degrades: []
    evals: [fixture-001, fixture-002]
    body: sources/gm-uispec.md

  - id: gm-datamodel
    kind: skill
    twin: gm-datamodel
    description: >-
      DATA_MODEL.md a partir das RNs (§6): ER, tabelas com tipos de banco
      (nunca tipos de aplicação) e decisão de armazenamento. Documenta
      APENAS tabelas — colunas não usadas marcadas "(não usado)".
    requires: [file, edit, write, ask]
    degrades: []
    evals: [fixture-001, fixture-002]
    body: sources/gm-datamodel.md

  - id: gm-apicontracts
    kind: skill
    twin: gm-apicontracts
    description: >-
      API_CONTRACTS.md (endpoints por grupo, convenções) e ERROR_CATALOG.md
      (validação 400 / negócio 422 / recurso 404) a partir do DATA_MODEL e
      das RNs.
    requires: [file, edit, write]
    degrades: []
    evals: [fixture-001, fixture-002]
    body: sources/gm-apicontracts.md

  - id: gm-criteria
    kind: skill
    twin: gm-criteria
    description: >-
      ACCEPTANCE_CRITERIA.md a partir das RNs: cada RN vira um ou mais
      critérios Dado-Quando-Então (Gherkin) pela tabela de derivação EARS → Gherkin.
    requires: [file, edit, write]
    degrades: []
    evals: [fixture-001, fixture-002]
    body: sources/gm-criteria.md

  - id: gm-arch
    kind: skill
    twin: gm-arch
    description: >-
      ARCHITECTURE.md (stack, diagrama, padrões, módulos, fluxo de dados)
      e SECURITY.md (autenticação, autorização, dados sensíveis, auditoria)
      a partir do DATA_MODEL e das RNs técnicas. Propagação de confiança
      para RNs de legado.
    requires: [file, edit, write]
    degrades: []
    evals: [fixture-001]
    body: sources/gm-arch.md

  # ================= ONDA 3 (6 itens com-twin — FECHA a classe) =================

  - id: gm-glossary
    kind: skill
    twin: gm-glossary
    description: >-
      Gera/atualiza os 3 glossários (DEV técnico, BUSINESS negócio, USER
      usuário final) com merge incremental — nunca deleta termos;
      definição conflitante vai para ask.
    requires: [file, write, ask]
    degrades: []
    evals: [fixture-001]
    body: sources/gm-glossary.md

  - id: gm-clientreq
    kind: skill
    twin: gm-clientreq
    description: >-
      CLIENT_REQUIREMENTS.md a partir do REQUIREMENTS.md — vista filtrada
      para o cliente, sem vocabulário de implementação; sincronização por
      delta do Git; pendências de decisão do cliente em Open Questions.
    requires: [file, glob, grep, write, edit, shell]
    degrades: []
    evals: [fixture-001]
    body: sources/gm-clientreq.md

  - id: gm-scope
    kind: skill
    twin: gm-scope
    description: >-
      SCOPE_AGREEMENT.md — acordo de escopo com o cliente em linguagem de
      negócio: unifica escopo, RNs confirmadas, mudanças em andamento e
      status de aprovação. Atualiza a cada novo lote ou CR aprovado.
    requires: [file, write, grep]
    degrades: []
    evals: [fixture-001]
    body: sources/gm-scope.md

  - id: gm-teststrategy
    kind: skill
    twin: gm-teststrategy
    description: >-
      TEST_STRATEGY.md (níveis, ferramentas, dados de teste, CI/CD) e
      DEFINITION_OF_DONE.md (checklist) a partir dos critérios de aceitação
      e da arquitetura.
    requires: [file, write, ask]
    degrades: []
    evals: [fixture-001]
    body: sources/gm-teststrategy.md

  - id: gm-compliance
    kind: skill
    twin: gm-compliance
    description: >-
      Checklist LGPD em specs/COMPLIANCE.md com os 10 eixos (levantamento,
      base legal, consentimento, minimização, retenção, direitos do titular,
      segurança, registros, terceiros, internacionalização), plano de
      lacunas e candidatos a RN/CR.
    requires: [file, glob, grep, write, ask]
    degrades: []
    evals: [fixture-001]
    body: sources/gm-compliance.md

  - id: gm-reverse
    kind: skill
    twin: gm-reverse
    description: >-
      Gera LEGACY_CONTEXT.md a partir da análise de sistema/banco existente
      (stack, arquitetura, banco, APIs, regras, armadilhas, glossário de
      equivalência). Só executa com legado: true ou sistema_existente: true
      no charter.
    requires: [file, grep, glob, write, ask]
    degrades: []
    evals: [fixture-001]
    body: sources/gm-reverse.md

  # ================= ONDA 4 (8 itens sem-twin — suporte/ciclo de vida) =================
  # Skills ABSORVIDAS pelo kit (validate, next, progress, tasks-pending,
  # wiki-lint, decision-audit, propagation-guard, scan, skill-eval) não
  # entram no lote — referências citam "(absorvida pelo kit)".

  - id: gm-known-error
    kind: skill
    description: >-
      Registra incidentes de suporte reais em KNOWN_ERRORS.md — reativo,
      NUNCA proativo. Cada entrada documenta sintoma, causa, workaround e
      status. Erro já previsto em contrato é referenciado, não duplicado.
    requires: [file, write, ask]
    degrades: []
    evals: [fixture-001]
    body: sources/gm-known-error.md

  - id: gm-incident-postmortem
    kind: skill
    description: >-
      Post-mortem estruturado de incidentes reais (timeline, causa raiz,
      impacto, ações corretivas, lições aprendidas). Upstream do
      gm-known-error — sugere a entrada de known error como follow-up.
    requires: [file, glob, write, ask]
    degrades: []
    evals: [fixture-001]
    body: sources/gm-incident-postmortem.md

  - id: gm-migration
    kind: skill
    description: >-
      MIGRATION.md durante o período real de migração de dados: escopo,
      mapeamento campo a campo, scripts UP/DOWN, cronograma, validação
      pós-migração e riscos. Condicional a trigger explícito do operador.
    requires: [file, write, ask]
    degrades: []
    evals: [fixture-001]
    body: sources/gm-migration.md

  - id: gm-howto
    kind: skill
    description: >-
      Documentação orientada a tarefas para suporte/usuário final
      (docs/howto/<feature>.md) quando uma feature é marcada [done].
      Modo de erro continue — documentação pós-lançamento não bloqueia.
    requires: [file, write, ask]
    degrades: []
    evals: [fixture-001]
    body: sources/gm-howto.md

  - id: gm-handover
    kind: skill
    description: >-
      Resumo de estado para assunção de módulo: veredito (finalizado/em
      andamento/bloqueado/não iniciado) com justificativa, guia de leitura,
      decisões-chave, stakeholders, pendências. Persiste em HANDOVER_LOG.md.
    requires: [file, glob, grep, ask]
    degrades: []
    evals: [fixture-001]
    body: sources/gm-handover.md

  - id: gm-decision-log
    kind: skill
    description: >-
      Formaliza decisões em DECISIONS.md (ADR-NNN, formato MADR) com merge
      incremental, rastreabilidade RN/PEND, supersede e entradas legadas
      DEC-XXX imutáveis. Modo strict.
    requires: [file, write, grep, glob, ask]
    degrades: []
    body: sources/gm-decision-log.md

  - id: gm-drift-detector
    kind: skill
    description: >-
      Detector de drift de qualidade: mede tendência temporal dos artefatos
      (tamanho, cobertura RN, IDs quebrados, formato, staleness) contra
      baseline de 3 medições e gera DRIFT_REPORT com score 0-100 por artefato.
    requires: [file, glob, grep, write]
    degrades: []
    evals: [fixture-001]
    body: sources/gm-drift-detector.md

  - id: gm-agent-health-monitor
    kind: skill
    description: >-
      Monitor de saúde dos components do workflow: subagents registrados,
      skills com erros, artefatos órfãos, staleness, propagation status,
      checklists, índice lazy do AGENTS.md e coerência PERMISSIONS.md.
      Read-only absoluto; relatório de módulo é commitável, de raiz é efêmero.
    requires: [file, glob, grep, ask, shell]
    degrades: []
    evals: [fixture-001]
    body: sources/gm-agent-health-monitor.md

  # ================= ONDA 5 (3 primaries + 3 tracker orchestrators — fecha a camada de primaries) =================

  - id: gm-doc
    kind: primary
    description: >-
      Agente principal para documentação técnica de sistemas existentes,
      engenharia reversa multi-repo e conformidade documental na letra D
      (Documentation). Conduz a arqueologia de código, extração de specs e
      indução de requisitos ancorados em evidências.
    mode: primary
    temperature: 0.3
    delegates: [gm-reverse-orchestrator, gm-translation-orchestrator, gm-quality-orchestrator, gm-support-orchestrator, gm-next, gm-progress, gm-cr-propagation-guard, gm-workflow-builder, gm-workflow-improver, gm-onboarding-orchestrator, gm-compliance-orchestrator]
    invokes: [gm-detect-onboarding, gm-prompt-gate, gm-security-audit, gm-agents-md-sync, gm-mcp-playwright-setup, gm-ui-capture, gm-validate]
    requires: [file, edit, glob, grep, shell, ask, subagent, skill, websearch]
    degrades: [webfetch, lsp, graph]
    body: sources/gm-doc.md

  - id: gm-dev
    kind: primary
    description: >-
      Agente principal para sessões de desenvolvimento de código —
      implementa features backend e frontend a partir dos artefatos de spec
      do módulo, delegando execução aos subagents backend/frontend. Nunca
      edita artefatos de specs.
    mode: primary
    temperature: 0.3
    delegates: [gm-dev-orchestrator, gm-dev-backend, gm-dev-frontend, gm-dev-qa, gm-dev-reviewer, gm-pack-orchestrator, gm-next, gm-progress, gm-cr-propagation-guard, gm-tasks-pending, gm-azure-orchestrator, gm-workflow-builder, gm-workflow-improver, gm-onboarding-orchestrator]
    invokes: [gm-detect-onboarding, gm-prompt-gate, gm-mcp-playwright-setup, gm-project-retrospective]
    requires: [file, edit, glob, grep, shell, ask, subagent, skill, websearch]
    degrades: [webfetch, lsp, graph]
    body: sources/gm-dev.md

  - id: gm-devops
    kind: primary
    description: >-
      Agente principal da camada DevOps — setup de VPS, infraestrutura de
      deploy (Docker, GHCR, SSH, Cloudflare tunnels, systemd, backup) e
      troubleshooting de deploy/produção, conduzido de forma guiada.
      Nunca executa comandos remotamente por conta própria.
    mode: primary
    temperature: 0.3
    delegates: [gm-devops-orchestrator, gm-next, gm-progress]
    invokes: [gm-detect-onboarding, gm-prompt-gate, gm-vps-setup, gm-vps-troubleshoot, gm-cicd-workflow, gm-observability, gm-known-error]
    requires: [file, glob, grep, shell, ask, skill, websearch]
    degrades: [edit, write, webfetch, lsp, graph]
    body: sources/gm-devops.md

  - id: gm-github-orchestrator
    kind: subagent
    description: >-
      Centraliza e roteia operações no GitHub: issues a partir das tasks,
      PRs com template padronizado, milestones. Roteia, não executa.
      Capacidade tracker FULL-only.
    mode: subagent
    temperature: 0.1
    invokes: [gm-gh-setup, gm-gh-issue-creator, gm-gh-pr-creator]
    requires: [file, glob, grep, shell, ask, skill, tracker]
    degrades: [edit, write]
    tracker: true
    body: sources/gm-github-orchestrator.md

  - id: gm-azure-orchestrator
    kind: subagent
    description: >-
      Centraliza e roteia operações no Azure DevOps: setup do MCP (server +
      PAT) e work items no Boards a partir das tasks do delivery. Roteia,
      não executa. Capacidade tracker FULL-only.
    mode: subagent
    temperature: 0.1
    invokes: [gm-azure-setup, gm-azure-workitem-creator]
    requires: [file, glob, grep, shell, ask, skill, tracker]
    degrades: [edit, write]
    tracker: true
    body: sources/gm-azure-orchestrator.md

  - id: gm-intake-orchestrator
    kind: subagent
    description: >-
      Orquestrador da fase de Intake: charter, CONSTITUTION e INDEX.
      Fronteira formal: Intake DETECTA legado (flags no charter); a
      DESCOBERTA de contexto do sistema existente é do domínio
      Documentação (handoff, não invocação). Roteia, não executa.
    mode: subagent
    temperature: 0.1
    invokes: [gm-charter, gm-init]
    requires: [file, glob, grep, ask, skill]
    degrades: [edit, write]
    body: sources/gm-intake-orchestrator.md

  # ================= ONDA 6 (11 subagents restantes — fecha o caminho de agents do runtime) =================

  - id: gm-compliance-orchestrator
    kind: subagent
    description: >-
      Orquestrador do domínio Compliance: verificação LGPD de produtos que
      tratam dado pessoal (checklist de 10 eixos), gatilho no intake (flag
