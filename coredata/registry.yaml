    description: >-
      Dashboard de progresso do pipeline. Consolida dados de TRACEABILITY.md,
      PROPAGATION_STATUS.md, PEND-XXX e artefatos da DAG em 5 blocos: cobertura
      de requisitos, drift, pendências de cliente, resultado (outcome) e fase
      atual. Read-only — não edita nada. Use quando o usuário pedir "dashboard
      de progresso", "status do projeto", "onde estamos" ou "relatório para
      reunião".
    requires: [file, glob, grep, shell]
    invokes: [gm-charter, gm-clarify, gm-cr-propagation-guard, gm-next, gm-requirements, gm-restructure, gm-traceability, gm-validate]
    body: sources/gm-progress.md

  - id: gm-tasks-pending
    kind: skill
    description: >-
      Lista as tasks que falta concluir (pendentes/em andamento) no pipeline,
      agrupadas por sistema → feature (RN-âncora) → tasks (ID RN-NNN-M, título,
      status, tipo, repo). Fontes: front matter `status` dos arquivos "RN-NNN —
      <título> — Feature.md" (IMP-093; fallback `— Tasks.md` pré-rename IMP-092)
      localizados por glob recursivo delivery/**/ (IMP-092 — agnóstico ao
      delivery_style da CONSTITUTION.md §9), fallbacks legados (pasta IMP-040
      com 2 arquivos, RN-*.md, TASKS*.md / TASKS.md) e, opcionalmente, issues
      abertas do GitHub via gh CLI (complemento, nunca bloqueante). Âncoras
      `PEND-NNN` em features são legado pré-IMP-094 (leitura ok — IMP-094); nada
      gera feature PEND. Read-only — nunca edita artefato, cria issue ou
      commita. Se o sistema NÃO for informado de antemão, questiona o operador
      antes de listar (cada sistema detectado + "Todos os sistemas") — nunca
      assume escopo por omissão (IMP-031). Use quando o usuário pedir "tasks
      pendentes", "listar tasks", "o que falta fazer", "backlog de tasks",
      "tasks em andamento" ou "tasks pendentes do <sistema>".
    requires: [file, glob, grep, shell]
    invokes: [gm-charter, gm-dev, gm-gh-issue-creator, gm-github-orchestrator, gm-next, gm-progress, gm-quality-orchestrator, gm-taskspec, gm-validate]
    body: sources/gm-tasks-pending.md

  - id: gm-cr-propagation-guard
    kind: skill
    description: >-
      Detecta artefatos técnicos desatualizados (stale) após aprovação ou
      implementação de Change Requests. Varre CHANGE_REQUESTS.md, identifica RNs
      afetadas, verifica presença nos downstreams e persiste o estado em
      PROPAGATION_STATUS.md. Não bloqueia — apenas sinaliza. Use quando o
      usuário pedir "propagação de CR", "verificar artefatos stale", "detectar
      staleness" ou "atualizar PROPAGATION_STATUS".
    requires: [file, glob, grep, shell]
    invokes: [gm-restructure, gm-validate]
    body: sources/gm-cr-propagation-guard.md

  - id: gm-decision-audit
    kind: skill
    description: >-
      Valida integridade semântica de DECISIONS.md: verifica se decisões novas
      contradizem decisões anteriores, se IDs são sequenciais, se RNs/PENDs
      referenciados existem, e se há decisões órfãs. Complementa gm-validate
      (que valida integridade estrutural da DAG) com foco em conflitos de
      decisões. Use quando o usuário pedir "auditar decisões", "verificar
      conflitos de decisões", "decision audit" ou "validar DECISIONS.md".
      Entradas legadas `DEC-XXX` são reconhecidas como imutáveis (não falham a
      auditoria).
    requires: [file, glob, grep, shell]
    invokes: [gm-decision-log, gm-jev-classifier, gm-restructure, gm-skill-eval, gm-validate]
    body: sources/gm-decision-audit.md

  - id: gm-governance
    kind: skill
    description: >-
      Revisa CONSTITUTION.md e PRODUCT_GOAL.md. Baixa frequência — só quando os
      princípios do produto precisam ser atualizados. Não cria do zero, apenas
      revisa o existente. Use quando o usuário pedir "revisar CONSTITUTION",
      "atualizar princípios do produto", "governança do workflow" ou "revisar
      PRODUCT_GOAL".
    requires: [file, edit, glob, grep, ask]
    body: sources/gm-governance.md

  - id: gm-adopt
    kind: skill
    description: >-
      Conduz a adoção do formato GOLMET por um workspace existente — handshake
      de 7 passos com o kit (dry-run → julgamento → gates → apply → validate
      tolerant → correção → strict), agente conduz e kit executa.
    requires: [file, edit, glob, grep, shell, ask]
    body: sources/gm-adopt.md

  - id: gm-validate
    kind: skill
    description: >-
      Percorre o grafo de documentos do projeto e valida integridade: RN sem
      downstream esperado, ID quebrado, CR aprovado sem reflexo. Gera relatório
      VALIDATION_REPORT.md. Suporta flag --fix para auto-correção. Use quando o
      usuário pedir "validar integridade", "checar a DAG", "validar referências
      cruzadas" ou "validação do módulo".
    requires: [file, glob, grep, shell]
    invokes: [gm-apicontracts, gm-compliance, gm-compliance-orchestrator, gm-datamodel, gm-doc, gm-drift-detector, gm-jev-classifier, gm-requirements, gm-restructure]
    body: sources/gm-validate.md

  - id: gm-wiki-lint
    kind: skill
    description: >-
      Audita integridade dos artefatos workflow: contradições entre seções,
      artefatos órfãos, referências cruzadas quebradas, links internos inválidos
      e drift de estrutura. Complementa gm-validate (que valida a DAG de RNs →
      downstreams) e gm-decision-audit (que valida DECISIONS.md) com foco em
      integridade documental dos artefatos individualmente. Use quando o usuário
      pedir "lint dos documentos", "verificar integridade dos artefatos", "wiki
      lint", "contradições nos docs" ou "validar estrutura".
    requires: [file, glob, grep, shell]
    invokes: [gm-decision-audit, gm-drift-detector, gm-registry-render, gm-restructure, gm-validate]
    body: sources/gm-wiki-lint.md

  - id: gm-next
    kind: subagent
    description: >-
      Recomenda a próxima ação no pipeline, com base no estado atual de
      artefatos, drift (PROPAGATION_STATUS.md) e pendências de cliente
      (PEND-XXX). Não executa nada, apenas diagnostica e recomenda. Invocar no
      início de uma sessão de trabalho para saber o que fazer.
    mode: subagent
    temperature: 0.1
    requires: [file, glob, grep, shell]
    invokes: [gm-apicontracts, gm-charter, gm-clarify, gm-datamodel, gm-init, gm-requirements, gm-teststrategy, gm-traceability, gm-validate]
    body: sources/gm-next.agent.md

  - id: gm-progress
    kind: subagent
    description: >-
      Dashboard de status do projeto workflow — cobertura de requisitos
      (TRACEABILITY.md), drift (PROPAGATION_STATUS.md), pendências de cliente
      (PEND-XXX), fase atual da DAG, gate de qualidade (VALIDATION_REPORT.md) e
      progresso de tasks (TASKS.md). Opcionalmente salva relatório em
      PROGRESS_REPORT.md com --save. Invocar para reuniões de status ou diff
      semanal de evolução.
    mode: subagent
    temperature: 0.1
    requires: [file, glob, grep, shell]
    invokes: [gm-clarify, gm-cr-propagation-guard, gm-next, gm-traceability]
    body: sources/gm-progress.agent.md

  - id: gm-tasks-pending
    kind: subagent
    description: >-
      Lista tasks pendentes/em andamento do pipeline por sistema — front matter
      dos arquivos "RN-NNN — <título> — Feature.md" em delivery/**/ (IMP-093,
      glob recursivo agnóstico ao delivery_style da §9 da CONSTITUTION),
      fallbacks `— Tasks.md` IMP-092 (pré-rename) e legados (pasta IMP-040 com 2
      arquivos, TASKS.md/RN-*.md) e issues GitHub via gh (opcional,
      não-bloqueante). Read-only; se o sistema não for informado de antemão,
      questiona o operador (cada sistema detectado + "Todos os sistemas") —
      nunca assume escopo por omissão (IMP-031). Use para "tasks pendentes",
      "listar tasks", "o que falta fazer", "backlog de tasks", "tasks em
      andamento".
    mode: subagent
    temperature: 0.1
    requires: [file, glob, grep, shell]
    invokes: [gm-charter, gm-taskspec]
    body: sources/gm-tasks-pending.agent.md

  - id: gm-cr-propagation-guard
    kind: subagent
    description: >-
      Detecta artefatos técnicos desatualizados (stale) quando um
      CHANGE_REQUESTS.md muda de estado. Varre os artefatos, identifica RNs
      afetadas por CRs aprovados/implementados, persiste o estado em
      PROPAGATION_STATUS.md, e sugere re-execução das skills de Fase 2
      associadas. Invocar após aprovar ou implementar um CR, ou para reconciliar
      o estado a qualquer momento.
    mode: subagent
    temperature: 0.1
    requires: [file, glob, grep, shell]
    invokes: [gm-apicontracts, gm-arch, gm-criteria, gm-datamodel, gm-glossary, gm-requirements, gm-uispec]
    body: sources/gm-cr-propagation-guard.agent.md

  - id: gm-jev-classifier
    kind: subagent
    description: >-
      Classifica textos usando o modelo Jev (TypeSafe System One) via API REST,
      com respostas tipadas e probabilidades calibradas. Segunda camada de
      validação das skills: contradições semânticas no gm-decision-audit,
      triagem de severidade no gm-quality-gates, e qualquer decisão que se
      beneficie de saída probability-aware. Invocar quando uma skill workflow
      solicitar calibração Jev ou quando o usuário pedir "classificar com jev".
    mode: subagent
    temperature: 0.1
    requires: []
    degrades: []
    invokes: [gm-decision-audit, gm-quality-gates]
    body: sources/gm-jev-classifier.agent.md

