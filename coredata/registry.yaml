      projetos, coleta os defaults do cliente (org Azure, projeto, repos,
      usuário) e grava `rules/client-profile.md` (IMP-103), coleta a identidade
      do operador (nome, e-mail, papel, contas git/GitHub) e grava
      `rules/operator-profile.md` (IMP-136), cria/repara o AGENTS.md local A
      PARTIR do `AGENTS.template.md` versionado (neutro — IMP-105), repõe o
      índice lazy de `rules/` (IMP-048), aplica os overrides de permissão dos
      subagents de dev (gm-dev-backend, gm-dev-frontend) no opencode.jsonc,
      instala os packs declarados no perfil (`packs:` — clone em `packs/<id>/`,
      instala `provides`, grava `sources.yaml`), delega para gm-azure-setup,
      gm-gh-setup, gm-aws-setup e gm-jev-setup (opcionais) e, quando presente na
      instalação (skill de pack opcional — IMP-105), gm-pia-connect-setup;
      valida o ambiente conforme o **perfil de adoção** — **core-only** (só o
      workflow: sem tracker/infra, valida só gh/git) ou **completo** (tracker
      Azure + infra + packs + validações de stack). Use quando o usuário pedir
      "configurar o workflow", "setup do workflow", "primeira configuração",
      "onboarding do workflow" ou ao migrar de máquina.
